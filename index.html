<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jos' Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="res/01.jpg" as="image">
</head>
<body>
    <div class="background" id="bg"></div>
    <div class="content">
        <div class="project-container">
            <div class="project-image">
                <img id="current-image" src="res/icon.png" alt="Project Image">
            </div>
            <h1>Hello, I'm Jos</h1> <!-- 添加标题文本 -->
            <hr class="main-divider"> <!-- 添加分割线 -->
            <div class="project-details">
                <ul id="project-list"></ul>
                <p id="project-desc"></p>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        const projectList = document.getElementById('project-list');
        const projectDesc = document.getElementById('project-desc');

        Projects.forEach((project, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = project.name;
            listItem.addEventListener('mouseover', () => {
                document.querySelectorAll('#project-list li').forEach(li => li.classList.remove('active'));
                listItem.classList.add('active');
                projectDesc.innerHTML = project.description;
                if (project.url) {
                    projectDesc.innerHTML += ` <a href="${project.url}" target="_blank">Go >>></a>`;
                }
            });
            if (project.url) {
                listItem.addEventListener('click', () => {
                    window.open(project.url, '_blank');
                });
            }
            if (index === 0) {
                listItem.classList.add('active');
                projectDesc.innerHTML = project.description;
                if (project.url) {
                    projectDesc.innerHTML += ` <a href="${project.url}" target="_blank">Go >>></a>`;
                }
            }
            projectList.appendChild(listItem);
        });

        const bgEl = document.getElementById('bg');
        const sources = ['res/01.jpg','res/02.png','res/03.png','res/04.png'];
        bgEl.style.backgroundImage = `url('${sources[0]}')`;

        const preloadAll = sources.map(src => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(src);
            img.onerror = reject;
            img.src = src;
        }));

        Promise.all(preloadAll)
            .then(() => {
                bgEl.classList.add('bg-animate');
            })
            .catch(() => {
                /* 保持首图，不启动动画 */
            });
    </script>
</body>
</html>
