<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jos' Home</title>
    <meta name="description" content="Jos - iOS/macOS 开发者，探索技术，创造乐趣">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Nav -->
    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-brand">
                <img src="assets/images/icon.png" alt="Jos" class="nav-logo">
                <span class="nav-name" id="nav-name"></span>
            </div>
            <div class="nav-links" id="nav-links"></div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-inner">
            <div class="hero-text">
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-subtitle" id="hero-subtitle"></p>
                <a class="hero-btn" id="hero-btn" href="#cards">了解更多</a>
            </div>
            <div class="hero-visual">
                <div class="hero-illustration">
                    <div class="illu-circle"></div>
                    <div class="illu-rect"></div>
                    <div class="illu-dot dot-1"></div>
                    <div class="illu-dot dot-2"></div>
                    <div class="illu-dot dot-3"></div>
                    <div class="illu-code">
                        <span>&lt;</span>Swift<span>/&gt;</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cards -->
    <section class="cards-section" id="cards">
        <div class="cards-inner" id="cards-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p id="footer-text"></p>
            <div class="footer-socials" id="footer-socials"></div>
        </div>
    </footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
