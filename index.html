    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // Apply saved theme before first paint (no flash)
        (function () {
            try {
                var theme = localStorage.getItem('jh-theme') || 'auto';
                var dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                var urlLang = new URLSearchParams(location.search).get('language');
                var lang = urlLang ? (urlLang.toLowerCase() === 'zh' ? 'zh' : 'en') : (localStorage.getItem('jh-lang') || 'en');
                document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
