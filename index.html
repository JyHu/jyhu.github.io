                <div class="music-player">
                    <div class="album-cover">
                        <div class="vinyl" id="vinyl">
                            <div class="vinyl-center"></div>
                        </div>
                    </div>
                    <div class="song-info">
                        <div class="song-title" id="songTitle">Select a song</div>
                        <div class="song-artist" id="songArtist">Artist</div>
                    </div>
                    <div class="progress-container">
                        <span class="time" id="currentTime">0:00</span>
                        <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                        <span class="time" id="duration">0:00</span>
                    </div>
                    <div class="controls">
                        <button class="control-btn" id="listBtn" title="播放列表">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"/>
                                <line x1="8" y1="12" x2="21" y2="12"/>
                                <line x1="8" y1="18" x2="21" y2="18"/>
                                <circle cx="3" cy="6" r="1.5" fill="white"/>
                                <circle cx="3" cy="12" r="1.5" fill="white"/>
                                <circle cx="3" cy="18" r="1.5" fill="white"/>
                            </svg>
                        </button>
                        <button class="control-btn" id="prevBtn">⏮</button>
                        <button class="control-btn play-btn" id="playBtn">▶</button>
                        <button class="control-btn" id="nextBtn">⏭</button>
                    </div>
                    <audio id="audioPlayer"></audio>
                    <div id="playlistMenu" class="playlist-menu" style="display:none;"></div>
